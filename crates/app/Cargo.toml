[package]
name = "fastdb-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fastdb"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
tokio.workspace = true
flume.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
platform-hal.workspace = true
mem-engine.workspace = true
db-wire.workspace = true
sql-intel.workspace = true
ui-core.workspace = true
ui-editor.workspace = true
ui-grid.workspace = true
rust-embed.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
futures.workspace = true
semver = "1.0"
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
tempfile = "3.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
block = "0.1.6"
cocoa = "0.26.0"
