[package]
name = "db-wire"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
tokio-postgres.workspace = true
postgres-types.workspace = true
bytes.workspace = true
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql_async.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
russh.workspace = true
russh-keys.workspace = true
parking_lot.workspace = true
flume.workspace = true
futures.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
mem-engine.workspace = true
platform-hal.workspace = true
uuid.workspace = true
chrono = "0.4"
serde_json = { version = "1.0", features = ["raw_value"] }

odbc-api = { version = "29", default-features = false, features = ["odbc_version_3_80", "vendored-unix-odbc", "wide"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
tempfile = "3.17"
