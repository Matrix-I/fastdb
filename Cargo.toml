[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/app",
    "crates/platform-hal",
    "crates/mem-engine",
    "crates/db-wire",
    "crates/sql-intel",
    "crates/ui-core",
    "crates/ui-editor",
    "crates/ui-grid",
]
# Vendored patch crates are not workspace members
exclude = ["vendor/xattr", "vendor/block", "vendor/proc-macro-error2"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# UI Framework (Zed GPUI)
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

# Async Runtime & Channels
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "fs"] }
flume = "0.11"
futures = "0.3"
async-trait = "0.1"

# Memory, Concurrency & Compression
bytes = "1.9"
memmap2 = "0.9"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
parking_lot = "0.12"
lru = "0.13"
smallvec = "1.13"
itoa = "1.0"
ryu = "1.0"
uuid = { version = "1.11", features = ["v4"] }

# Database Drivers & SSH
tokio-postgres = { version = "0.7", features = ["runtime", "with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
postgres-types = { version = "0.2", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
mysql_async = "0.34"
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
russh = "0.46"
russh-keys = "0.46"

# Text Buffer & SQL AST
ropey = "1.6"
tree-sitter = "0.24"
tree-sitter-sequel = "0.3"

# OS Integration (macOS & Linux)
directories = "5.0"
keyring = { version = "3.6", features = ["apple-native", "sync-secret-service", "crypto-rust"] }

# Error & Logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8.13"

# Internal workspace dependencies
platform-hal = { path = "crates/platform-hal" }
mem-engine = { path = "crates/mem-engine" }
db-wire = { path = "crates/db-wire" }
sql-intel = { path = "crates/sql-intel" }
ui-core = { path = "crates/ui-core" }
ui-editor = { path = "crates/ui-editor" }
ui-grid = { path = "crates/ui-grid" }

# gpui 0.2.2 pulls in xattr 0.2.3 (via gpui_http_client -> zed-async-tar), which reads
# libc::ENOATTR on Linux; libc 0.2.190 removed it. Drop this patch and vendor/xattr once
# `cargo tree -i xattr` no longer shows xattr 0.2.x.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
# These transitive GPUI/MySQL dependencies trigger future-incompatibility lints.
# Remove each patch once the dependency graph resolves to an upstream fix.
block = { path = "vendor/block" }
proc-macro-error2 = { path = "vendor/proc-macro-error2" }

# Unoptimized GPUI makes every re-render (one per key press or hover change) visibly slow,
# so dev builds optimize dependencies fully and our own crates lightly.
# Debug info is the main source of target/ growth: keep only line tables for our crates
# (backtraces still show file:line) and none for dependencies.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
