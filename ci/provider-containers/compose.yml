# Disposable local provider servers. Run one profile at a time on small machines.
name: fastdb-provider-tests
services:
  oracle:
    profiles: [oracle]
    image: ghcr.io/gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${FASTDB_ORACLE_PASSWORD:?Set a disposable Oracle password}
      APP_USER: fastdb
      APP_USER_PASSWORD: ${FASTDB_ORACLE_PASSWORD}
    ports: ["127.0.0.1:11521:1521"]
    shm_size: 512m
    mem_limit: 3g
    healthcheck:
      test: [CMD, healthcheck.sh]
      interval: 10s
      timeout: 10s
      retries: 60
  sqlserver:
    profiles: [sqlserver]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: ${FASTDB_ACCEPT_MSSQL_EULA:-N}
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${FASTDB_SQLSERVER_PASSWORD:?Set a disposable SQL Server password}
      MSSQL_MEMORY_LIMIT_MB: 2048
    ports: ["127.0.0.1:11433:1433"]
    mem_limit: 3g
  db2:
    profiles: [db2]
    image: icr.io/db2_community/db2:latest
    platform: linux/amd64
    privileged: true
    environment:
      LICENSE: ${FASTDB_ACCEPT_DB2_LICENSE:-decline}
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${FASTDB_DB2_PASSWORD:?Set a disposable Db2 password}
      DBNAME: FASTDB
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
      TO_CREATE_SAMPLEDB: "false"
      REPODB: "false"
      IS_OSXFS: "false"
      PERSISTENT_HOME: "false"
      HADR_ENABLED: "false"
    ports: ["127.0.0.1:55000:50000"]
    mem_limit: 4g
