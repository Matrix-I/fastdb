name: Release

# Pushing a `vX.Y.Z` (or `vX.Y.Z-rc.N`) tag builds every asset, signs the
# checksum manifest and creates a *draft* GitHub release. Publishing the draft
# stays a manual step (see docs/RELEASE_PLAN.md).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Build jobs only read the repository; only the `release` job may write, and
# only it can see the signing secrets (through the `release` environment).
permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      version: ${{ steps.v.outputs.version }}
      deb_version: ${{ steps.v.outputs.deb_version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the tagged commit can be checked against main.
          fetch-depth: 0
      - id: v
        name: Tag matches Cargo.toml and is on main
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Same parser as bundle_macos.sh and ci/build-linux.sh.
          cargo_ver=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          echo "tag=$tag Cargo.toml=$cargo_ver"
          # An RC tag needs an RC version in Cargo.toml, so RC builds never
          # report the final version and the final release upgrades them.
          [ "$cargo_ver" = "$tag" ] || { echo "::error::Cargo.toml version $cargo_ver != tag $tag"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          {
            echo "version=$tag"
            echo "deb_version=${tag/-rc./~rc.}"
            case "$tag" in *-rc.*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac
          } >> "$GITHUB_OUTPUT"

  macos:
    name: macOS aarch64
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: Test
        # Live-database tests skip here; ci.yml covers them on main.
        run: cargo test --workspace --locked
      - name: Bundle
        # minisign is not installed here, so the macOS-only manifest stays
        # unsigned; the release job signs the combined manifest.
        run: ./bundle_macos.sh --no-install
      - name: Collect assets
        run: |
          mkdir -p out
          cp dist/FastDB.dmg dist/FastDB-macos-aarch64.zip dist/fastdb-macos-aarch64 out/
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: out/
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries and packaging tools
        # Same libraries as the linux-app job in ci.yml, plus dpkg-dev for
        # dpkg-shlibdeps and the tools the package test uses.
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libdbus-1-dev libxcb1-dev libxkbcommon-dev
          libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libasound2-dev
          libvulkan-dev libssl-dev dpkg-dev binutils desktop-file-utils
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: Test
        # Live-database tests skip here; ci.yml covers them on main.
        run: cargo test --workspace --locked
      - name: Build
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu -p fastdb-app
          mkdir -p out
          cp target/x86_64-unknown-linux-gnu/release/fastdb out/fastdb-linux-x86_64
      - name: Package and test
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DEB_VERSION: ${{ needs.version.outputs.deb_version }}
        run: |
          bash ci/package-deb.sh out/fastdb-linux-x86_64 "$DEB_VERSION" out
          # GitHub may rewrite `~` in asset names; publish under the tag version.
          if [ "$DEB_VERSION" != "$VERSION" ]; then
            mv "out/fastdb_${DEB_VERSION}_amd64.deb" "out/fastdb_${VERSION}_amd64.deb"
          fi
          bash ci/test-package-deb.sh out/fastdb-linux-x86_64
          dpkg-deb -f "out/fastdb_${VERSION}_amd64.deb" Depends
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/
          if-no-files-found: error

  deb:
    name: Debian package install
    needs: [version, linux]
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: in/
      - name: Install, check and remove with apt
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq "./in/fastdb_${VERSION}_amd64.deb"
          cmp /usr/bin/fastdb in/fastdb-linux-x86_64
          test -f /usr/share/applications/fastdb.desktop
          # Every shared library must come from the package's Depends.
          if ldd /usr/bin/fastdb | grep -F 'not found'; then
            echo "::error::unresolved shared libraries after apt install"; exit 1
          fi
          apt-get remove -y -qq fastdb
          if test -e /usr/bin/fastdb || test -e /usr/share/applications/fastdb.desktop; then
            echo "::error::files left behind after apt remove"; exit 1
          fi

  release:
    name: Sign and draft release
    needs: [version, macos, linux, deb]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required reviewers on this environment gate access to the signing key.
    environment: release
    permissions:
      contents: write
    # No third-party actions here: only GitHub's own checkout/download actions
    # run in the job that holds the signing key.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets/
          merge-multiple: true
      - name: Check assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DEB_VERSION: ${{ needs.version.outputs.deb_version }}
        run: |
          cd release-assets
          expected=(FastDB.dmg FastDB-macos-aarch64.zip fastdb-macos-aarch64 fastdb-linux-x86_64 "fastdb_${VERSION}_amd64.deb")
          for f in "${expected[@]}"; do test -s "$f" || { echo "::error::missing asset $f"; exit 1; }; done
          count=$(find . -mindepth 1 -maxdepth 1 | wc -l)
          [ "$count" -eq "${#expected[@]}" ] || { echo "::error::unexpected assets:"; find . -mindepth 1; exit 1; }
          # Both binaries are built from this tag's checkout, whose Cargo.toml
          # the version job matched; check the versions the packages declare.
          unzip -p FastDB-macos-aarch64.zip FastDB.app/Contents/Info.plist | grep -Fq "<string>$VERSION</string>"
          [ "$(dpkg-deb -f "fastdb_${VERSION}_amd64.deb" Version)" = "$DEB_VERSION" ] || { echo "::error::.deb version != $DEB_VERSION"; exit 1; }
          sha256sum "${expected[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: Sign checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "::error::MINISIGN_SECRET_KEY secret is not set"; exit 1; }
          umask 077
          key_file="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key_file"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key_file" -m release-assets/SHA256SUMS.txt
          # Catch a secret key that does not match the published public key.
          minisign -V -m release-assets/SHA256SUMS.txt -p resources/minisign.pub
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # A re-run after a partial failure refreshes the assets of its own
          # draft, but never touches a release that was already published.
          if is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null); then
            [ "$is_draft" = "true" ] || { echo "::error::release $GITHUB_REF_NAME is already published"; exit 1; }
            gh release upload "$GITHUB_REF_NAME" --clobber release-assets/*
          else
            flags=(--draft --verify-tag --generate-notes --title "FastDB $GITHUB_REF_NAME")
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" "${flags[@]}" release-assets/*
          fi
